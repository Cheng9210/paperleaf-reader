<!doctype html><html><head><meta charset="utf-8"><title>PDF zoom regression</title>
<link rel="stylesheet" href="/vendor/pdf_viewer.css"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/reader.css">
<style>body{padding:12px}.pdf-scroll{height:560px;width:650px}.textLayer{position:absolute}button{padding:10px;background:#dceade}</style></head>
<body><button id="run" disabled>Run zoom regression</button><span id="zoom-label"></span><output id="result">Loading PDF</output><div class="pdf-scroll"><div></div></div>
<script type="module">
import {loadPdf} from '/lib/pdf.js';import {ContinuousPdf} from '/lib/continuous-pdf.js';
const scroll=document.querySelector('.pdf-scroll'),result=document.querySelector('#result'),button=document.querySelector('#run');
const viewer=new ContinuousPdf(scroll,()=>{},()=>{});await viewer.open(await loadPdf(new Uint8Array(await(await fetch('/demo.pdf')).arrayBuffer())));
const until=async(predicate)=>{const limit=performance.now()+15000;while(!predicate()){if(performance.now()>limit)throw Error('Render timeout');await new Promise(requestAnimationFrame);}};
await until(()=>viewer.pages[0]?.ready);result.textContent='Ready';button.disabled=false;
button.onclick=async()=>{button.disabled=true;let blanks=0,frames=0,watch=true,replacements=0;
  const page=viewer.pages[0],initial=page.el.querySelector('canvas');let previous=initial;
  const painted=canvas=>{if(canvas.width<2)return false;const pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;let ink=0;for(let i=0;i<pixels.length;i+=52){if(pixels[i+3]>0&&pixels[i]+pixels[i+1]+pixels[i+2]<650)ink++;}return ink>100;};
  const inspect=()=>{if(!watch)return;frames++;const current=page.el.querySelector('canvas');if(current!==previous){replacements++;previous=current;}if(!painted(current))blanks++;requestAnimationFrame(inspect);};inspect();
  try{for(const zoom of [1.3,1.7,.8,1.1,2,1]){viewer.setZoom(zoom,300,260);await until(()=>page.ready&&!viewer.zooming);}
    for(const zoom of [1.1,1.2,1.4,1.6,1.3,1]){viewer.setZoom(zoom,300,260);await new Promise(requestAnimationFrame);}await until(()=>page.ready&&!viewer.zooming);
    watch=false;result.textContent=JSON.stringify({passed:blanks===0&&replacements>=6,blankFrames:blanks,frames,replacements,textSpans:page.el.querySelectorAll('.textLayer span').length});
  }catch(e){watch=false;result.textContent='FAIL '+e.message;}finally{button.disabled=false;}
};
</script></body></html>
